[project]
name = "jobspider"
version = "0.1.0"
description = "可扩展的招聘公告采集框架：BaseSpider + 站点插件 + SQLite 增量入库"
requires-python = ">=3.9"
dependencies = [
    "curl-cffi>=0.7",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
